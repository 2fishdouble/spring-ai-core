spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.12.22:3306/hotkey_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowMultiQueries=true
    username: root
    password: Mysql.3306.mysql
    type: com.zaxxer.hikari.HikariDataSource
    # HikariCP 连接池详细配置
    hikari:
      # 池中最大连接数（推荐：CPU核心数 * 2 + 核心磁盘数）
      maximum-pool-size: 20
      # 最小空闲连接数（建议与 maximum-pool-size 保持一致，避免频繁创建/销毁连接）
      minimum-idle: 5
      # 空闲连接存活最大超时时间（毫秒），超出的空闲连接将被释放，默认 600000（10分钟）
      idle-timeout: 600000
      # 连接在池中的最大生命周期（毫秒），必须短于 MySQL 的 wait_timeout，默认 1800000（30分钟）
      max-lifetime: 1800000
      # 等待连接池分配连接的最大超时时间（毫秒），超过将抛出 SQLException，默认 30000（30秒）
      connection-timeout: 30000
      # 用于测试连接有效性的 SQL 语句
      connection-test-query: SELECT 1
      # 连接测试超时时间（毫秒），默认 5000（5秒）
      validation-timeout: 5000
      # 自动提交事务，默认 true
      auto-commit: true
      # 连接池名称
      pool-name: HotkeyHikariCP
  data:
    redis:
      host: 192.168.12.23
      port: 51111
      password: Redis.51111.redis
      database: 0
      timeout: 10s
      connect-timeout: 10s
      client-type: LETTUCE
      lettuce:
        shutdown-timeout: 100ms
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
  profiles:
    active:
      - dev
  application:
    name: spring-ai-core
  ai:
    tools:
      throw-exception-on-error: true
      observations:
        include-content: true
      resolution:
        fallback:
          enabled: false
      limits:
        on-limit-exceeded: throw
        max-calls-per-tool-default: 40
    chat:
      client:
        enabled: true
        observations:
          log-completion: true
          log-prompt: true
        tool-calling:
          enabled: true
    openai:
      base-url: https://api.deepseek.com
      api-key: sk-faf17e79516c487f93756523d7c6020f
      chat:
        temperature: 0.0
        model: deepseek-v4-flash
    mcp:
      client:
        enabled: false
        initialized: true
        name: spring-ai-core-mcp-client
        version: 1.0.0
        type: SYNC
        request-timeout: 20s
        root-change-notification: true
        streamable-http:
          connections:
            mcp-server:
              url: http://localhost:8080/mcp
        toolcallback:
          enabled: true
server:
  port: 8081
logging:
  level:
    org.springframework.ai: DEBUG